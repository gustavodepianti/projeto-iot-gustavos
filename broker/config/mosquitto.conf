# Porta MQTT, aberta para fora do container
listener 1883

# Segurança: sem anônimos, senhas com hash e ACL
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Dados persistentes (mensagens retidas, como o status)
persistence true
persistence_location /mosquitto/data/

# Logs no arquivo e também na saída do container
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_timestamp_format %Y-%m-%dT%H:%M:%S